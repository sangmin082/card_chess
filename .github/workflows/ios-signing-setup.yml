# 맥 없이 iOS 배포 서명 자산을 만들어 저장소 시크릿에 넣는다. 처음 한 번, 그리고 1년마다(인증서 만료) 실행한다.
#
# 미리 필요한 저장소 시크릿
#   APPSTORE_ISSUER_ID, APPSTORE_KEY_ID, APPSTORE_PRIVATE_KEY : App Store Connect API 키 (Admin 역할)
#   GH_PAT : 이 저장소의 "Secrets: Read and write" 권한이 있는 fine-grained 토큰
#
# 실행 후 자동으로 만들어지는 시크릿
#   IOS_CERTIFICATE_P12_BASE64, IOS_CERTIFICATE_PASSWORD, IOS_PROVISION_PROFILE_BASE64, IOS_TEAM_ID
#
# 자세한 절차: docs/IOS_BUILD.md
name: iOS Signing Setup

on:
  workflow_dispatch:
    inputs:
      revoke_existing:
        description: '기존 Apple Distribution 인증서를 모두 폐기하고 새로 만들기 (인증서 개수 한도 오류가 날 때만)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-signing-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          missing=()
          [ -n "$ASC_ISSUER_ID" ] || missing+=(APPSTORE_ISSUER_ID)
          [ -n "$ASC_KEY_ID" ] || missing+=(APPSTORE_KEY_ID)
          [ -n "$ASC_PRIVATE_KEY" ] || missing+=(APPSTORE_PRIVATE_KEY)
          [ -n "$GH_PAT" ] || missing+=(GH_PAT)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::저장소 시크릿이 없습니다: ${missing[*]} (docs/IOS_BUILD.md 참고)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet cryptography

      - name: Create certificate & provisioning profile
        env:
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          REVOKE_EXISTING: ${{ inputs.revoke_existing }}
        run: |
          args=(--out "$RUNNER_TEMP/signing")
          if [ "$REVOKE_EXISTING" = "true" ]; then args+=(--revoke-existing); fi
          python3 scripts/ios_signing_setup.py "${args[@]}"

      - name: Save repository secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          OUT="$RUNNER_TEMP/signing"
          save() {
            gh secret set "$1" --repo "$GITHUB_REPOSITORY" < "$OUT/$2"
            echo "✓ $1"
          }
          save IOS_CERTIFICATE_P12_BASE64 p12_base64.txt
          save IOS_CERTIFICATE_PASSWORD p12_password.txt
          save IOS_PROVISION_PROFILE_BASE64 profile_base64.txt
          save IOS_TEAM_ID team_id.txt

      - name: Summary
        if: success()
        run: |
          {
            echo "## iOS 서명 설정 완료"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/signing/summary.json"
            echo
            echo '```'
            echo
            echo "다음 단계"
            echo "1. App Store Connect 에서 위 Bundle ID 로 앱을 만든다 (처음 한 번)."
            echo "2. Actions → iOS → Run workflow 로 TestFlight 업로드."
            echo "3. GH_PAT 시크릿과 토큰은 이제 지워도 된다 (1년 뒤 재설정 때 다시 만든다)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove local files
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
