# GitHub Pages 에 웹 버전을 배포한다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 설정해야 동작한다.
name: Deploy Web (GitHub Pages)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      # Pages 가 켜져 있지 않으면 빌드/배포를 건너뛴다 (main 이 빨간불이 되지 않게).
      - name: Check GitHub Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null | grep -q workflow; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages 가 꺼져 있거나 Source 가 GitHub Actions 가 아닙니다. Settings → Pages 에서 켜면 배포됩니다."
          fi
      - uses: actions/checkout@v4
        if: steps.pages.outputs.enabled == 'true'
      - uses: subosito/flutter-action@v2
        if: steps.pages.outputs.enabled == 'true'
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
        if: steps.pages.outputs.enabled == 'true'
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: build/web

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
